<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tìm kiếm Câu hỏi v6.0 - Camera OCR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body { margin: 10px 15px; font-family: Arial, sans-serif; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; word-wrap: break-word; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; vertical-align: top; }
    th { background-color: #f3f3f3; position: sticky; top: 0; z-index: 1; }
    td:nth-child(1), th:nth-child(1) { width: 45px; text-align: center; }
    td:nth-child(7), th:nth-child(7) { width: 70px; text-align: center; }
    .bold-blue { font-weight: bold; color: blue; }
    .italic-tiny { font-style: italic; font-size: 0.8em; opacity: 0.8; }
    .btn { background-color: #2563eb; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .btn-camera { background-color: #10b981; }
    #videoContainer { display: none; position: relative; margin-bottom: 10px; }
    #video { width: 100%; max-width: 500px; border-radius: 8px; border: 2px solid #10b981; }
    #canvas { display: none; }
    .loading-ocr { display: none; color: #f59e0b; font-weight: bold; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <div class="max-w-full mx-auto">
    <h2 class="text-xl font-bold mb-3">📸 Tìm kiếm v6.0 (Hỗ trợ Camera OCR)</h2>

    <div class="flex flex-wrap gap-2 mb-3">
      <button class="btn btn-camera" onclick="toggleCamera()">📷 Mở/Tắt Camera</button>
    </div>

    <div id="videoContainer">
      <video id="video" autoplay playsinline></video>
      <div class="mt-2 flex gap-2">
        <button class="btn bg-red-500" onclick="captureImage()">✨ Chụp & Tìm</button>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="ocrStatus" class="loading-ocr mb-2">Đang nhận diện chữ... vui lòng đợi...</div>

    <div class="flex items-center mb-2">
      <input id="searchInput" type="text" placeholder="Nhập từ khóa hoặc quét camera..." class="border px-2 py-1 w-full rounded" onkeyup="debounceSearch()">
      <button class="btn bg-gray-300 text-black ml-2" onclick="clearSearch()">RESET</button>
    </div>

    <div id="suggestionBox" class="mb-2 italic text-blue-600"></div>

    <table id="dataTable">
      <thead>
        <tr>
          <th>STT</th>
          <th>Câu hỏi</th>
          <th>Đáp án 1</th>
          <th>Đáp án 2</th>
          <th>Đáp án 3</th>
          <th>Đáp án 4</th>
          <th>Đúng</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    let data = [];
    let fuse;
    let searchTimeout;
    let stream = null;

    // --- TẢI DỮ LIỆU TỪ FILE DATA_1.JSON ---
    async function loadJsonData() {
      try {
        const response = await fetch('data_1.json');
        const json = await response.json();
        
        // Chuyển đổi định dạng dữ liệu từ data_1.json tương thích với thuật toán cũ
        data = json.data_table.map((item, i) => {
          let ans = (item.col_7 || "").toString().trim().toUpperCase();
          if (ans === "A") ans = 1; 
          else if (ans === "B") ans = 2;
          else if (ans === "C") ans = 3; 
          else if (ans === "D") ans = 4;
          else ans = Number(ans);

          // Tạo lại mảng raw gồm 7 cột dữ liệu chính tương đương hàng trong Excel
          const raw = [
            item.col_1,
            item.col_2,
            item.col_3,
            item.col_4,
            item.col_5,
            item.col_6,
            ans
          ];

          return { 
            id: i + 1, 
            question: item.col_2 || "", 
            normalized: removeAccents(item.col_2 || ""), 
            raw: raw 
          };
        });

        fuse = new Fuse(data, { keys: ["normalized"], threshold: 0.4 });
        renderTable(data.map(d => d.raw));
      } catch (error) {
        console.error("Lỗi khi tải dữ liệu từ data_1.json:", error);
        alert("Không thể tải dữ liệu từ file data_1.json. Vui lòng kiểm tra lại đường dẫn file.");
      }
    }

    // Tự động nạp dữ liệu khi trang web sẵn sàng
    window.addEventListener('DOMContentLoaded', loadJsonData);

    // --- XỬ LÝ CAMERA ---
    async function toggleCamera() {
      const container = document.getElementById('videoContainer');
      const video = document.getElementById('video');
      
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        container.style.display = 'none';
      } else {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
          video.srcObject = stream;
          container.style.display = 'block';
        } catch (err) {
          alert("Không thể truy cập Camera. Hãy cấp quyền!");
        }
      }
    }

    async function captureImage() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const status = document.getElementById('ocrStatus');
      
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      status.style.display = 'block';
      
      try {
        const result = await Tesseract.recognize(canvas.toDataURL('image/png'), 'vie+eng');
        const text = result.data.text.replace(/\n/g, ' ').trim();
        document.getElementById('searchInput').value = text;
        searchData();
      } catch (e) {
        console.error(e);
        alert("Lỗi nhận diện hình ảnh.");
      } finally {
        status.style.display = 'none';
      }
    }

    // --- LOGIC TÌM KIẾM (Giữ nguyên từ v5.6) ---
    function removeAccents(str) {
      return str.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
    }

    function renderTable(arr) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      arr.forEach((row, index) => {
        const tr = document.createElement("tr");
        const correctIdx = row[6];
        for (let i = 0; i < 7; i++) {
          const td = document.createElement("td");
          td.innerHTML = row[i] ?? "";
          if (i === 1 + correctIdx) td.classList.add("bold-blue");
          else if ([2,3,4,5].includes(i)) td.classList.add("italic-tiny");
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
    }

    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(searchData, 300);
    }

    function searchData() {
      const kw = removeAccents(document.getElementById("searchInput").value);
      if (!kw) { renderTable(data.map(d => d.raw)); return; }
      const res = fuse.search(kw);
      renderTable(res.slice(0, 50).map(r => r.item.raw));
      document.getElementById("suggestionBox").textContent = `Tìm thấy ${res.length} kết quả.`;
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      searchData();
    }
  </script>
</body>
</html>
